<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>FINORA Agent</title>
    <style>
        body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 16px; background: #fafafa; }
        .header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
        .logo { width: 32px; height: 32px; background: linear-gradient(135deg, #4f46e5, #7c3aed); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 16px; }
        .title { font-weight: 800; color: #1e1b4b; margin: 0; font-size: 16px; }
        .subtitle { color: #6366f1; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; margin: 0; }
        .panel { background: white; padding: 16px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 12px; }
        .btn { display: block; width: 100%; padding: 10px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; }
        .btn:hover { background: #4338ca; }
        .btn:disabled { background: #a5b4fc; cursor: not-allowed; }
        .status { margin-top: 10px; font-size: 12px; color: #64748b; line-height: 1.5; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">F</div>
        <div>
            <h1 class="title">FINORA Agent</h1>
            <p class="subtitle">SaaS Parity Radar</p>
        </div>
    </div>
    <div class="panel">
        <p style="font-size: 13px; color: #334155; margin-top: 0; margin-bottom: 16px;">
            Inject FINORA's pricing oracle to analyze current billing page for global tax arbitrage.
        </p>
        <button id="analyzeBtn" class="btn">Scan Invoice</button>
        <div id="status" class="status"></div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
